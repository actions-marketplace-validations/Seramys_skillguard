[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seramys-skillguard"
version = "0.3.0"
description = "Supply-chain security scanner for AI agent skills"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SkillGuard contributors" }]
keywords = ["ai", "agent", "skills", "security", "supply-chain", "scanner"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/Seramys/skillguard"
Repository = "https://github.com/Seramys/skillguard"
Issues = "https://github.com/Seramys/skillguard/issues"

[project.scripts]
skillguard = "skillguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skillguard = ["_bin/*"]